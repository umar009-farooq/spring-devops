name: Java CI/CD with Docker

# 1. EVENT: Trigger this pipeline every time someone pushes to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  # 2. JOB: Define a workspace running on a hosted Ubuntu machine
  build-and-test:
    runs-on: ubuntu-latest

    # 3. STEPS: The linear sequence of tasks the robot executes
    steps:
      # Step 1: Clone your repository onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 21 on the virtual machine
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Caches dependencies so future builds are faster

      # Step 3: Run the Maven build to compile code and run tests
      - name: Build with Maven
        run: ./mvnw clean package

      # Step 4: Test building the Docker image to ensure the Dockerfile works
      - name: Build Docker Image
        run: docker build -t spring-devops:latest .